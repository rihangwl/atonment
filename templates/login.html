<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Atonement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            ;
        }

        #backgroundimage {
            position: fixed;
            /* MUST be fixed */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #4e4a4a66;
    z-index: -1;
} */

        .login-card {
            width: 900px;
            /* fixed width */
            height: 550px;
            /* fixed height */
            background: white;
            border-radius: 15px;
            /* rounded corners */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            /* soft shadow */
            display: flex;
            /* ange do hiso me divide left & right karne ke liye*/
            overflow: hidden;
            /* important for rounded corners */
        }

        /* LEFT SIDE */
        .left-side {
            flex: 1;
            background: #8fb3a4;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-side img {
            width: 200px;
            margin-bottom: 20px;
        }

        .left-side h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .left-side p {
            font-size: 14px;
        }

        /* RIGHT SIDE */
        .right-side {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-side h2 {
            margin-bottom: 30px;
        }

        .right-side form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right-side input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }


        .right-side button {
            padding: 12px;
            background: #8fb3a4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .right-side button:hover {
            background: #6f9889;
        }

        .signup-text {
            margin-top: 20px;
            font-size: 16px;
        }

        .signup-text a {
            color: #693535;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }


    </style>

</head>

<body>

    <video id="backgroundimage" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='videos/back2.mp4') }}" type="video/mp4">
    </video>

    <!-- <div class="overlay"></div> -->

    <div class="login-card">

        <!-- LEFT SIDE -->
        <div class="left-side">
            <img src="{{ url_for('static', filename='images/bird.png') }}">
            <h2>Welcome to Atonement</h2>
            <p>Your personal digital library experience.</p>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">
            <h2>Sign In</h2>

            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>

                <button type="submit">Sign In</button>
            </form>

            <p class="signup-text">
                New here? <a href="/register">Create Account</a>
            </p>
        </div>

    </div>


</body>

</html>
